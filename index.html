<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 식물 도감</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: botanical plate. Centered serif title between two sprigs, a tab row (add / all / by group / count), then a hairline-ruled grid of numbered specimen cells with the Korean name underneath. */
:root {
  --bg: #F6F1E3;
  --fg: #1F3326;
  --muted: #5F6B5E;
  --line: #D6D0BC;
  --card: #FCFAF2;
  --accent: #2F6B43;
  --accent-fg: #FFFFFF;
  --tint: #E8E6D2;
  --danger: #A8382B;
  --leafL: 36%;
  --font-display: "Gowun Batang", "Noto Serif KR", serif;
  --font-body: "IBM Plex Sans KR", "Noto Sans KR", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
html.lock { overflow: hidden; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-block: max(14px, env(safe-area-inset-top, 0px)) 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
img { max-width: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.topline { display: flex; justify-content: flex-end; }
.iconbtn { width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid var(--line); border-radius: 50%; cursor: pointer; }
.iconbtn:hover { border-color: var(--accent); }
.iconbtn svg { width: 20px; height: 20px; }
.title-row { display: flex; align-items: center; justify-content: center; gap: clamp(8px, 3vw, 28px); }
.sprig { width: clamp(44px, 12vw, 96px); height: auto; color: var(--accent); opacity: .8; flex: none; }
.sprig.r { transform: scaleX(-1); }
.tt { text-align: center; min-width: 0; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 7vw, 46px); line-height: 1.15; margin: 0; text-wrap: balance; }
.sub { margin: 6px 0 0; font-family: var(--font-mono); font-size: 11px; letter-spacing: .28em; color: var(--muted); }
.rule { height: 1px; background: var(--line); position: relative; margin-top: 4px; }

.tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 14px; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; font-weight: 500; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.small { min-height: 34px; padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .55; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 8px 14px; min-height: 40px; cursor: pointer; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.count { font-family: var(--font-mono); font-size: 13px; letter-spacing: .04em; color: var(--muted); margin-left: auto; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.cell { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 22px 6px 12px; min-width: 0; background: transparent; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); border-radius: 0; cursor: pointer; text-align: center; }
.cell:hover { background: var(--tint); }
.cell .n { position: absolute; left: 8px; top: 6px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.art { display: block; width: 100%; max-width: 120px; aspect-ratio: 1 / 1; overflow: hidden; }
.art img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 2px; }
.art svg, .ph-empty svg { width: 100%; height: 100%; display: block; }
.nm { font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; }
.grp { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.grp h2 { font-family: var(--font-display); font-size: 20px; margin: 0; display: flex; align-items: baseline; gap: 8px; }
.gc { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.msg { padding: 28px 0; color: var(--muted); white-space: pre-wrap; }
.empty { color: var(--muted); }

input, textarea { font: inherit; font-size: 16px; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 9px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 70px; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }

.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(10, 18, 13, .58); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.panel { position: relative; width: 100%; max-width: 860px; margin: auto 0; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; }
.panel.small { max-width: 460px; }
.sheet-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 10px 0 16px; }
.sheet-bar h2 { font-family: var(--font-display); font-size: 20px; margin: 0; }
.body { padding: 10px 18px 22px; display: flex; flex-direction: column; gap: 18px; }
.top2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
@media (min-width: 720px) { .top2 { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 26px; } }
.ph { display: block; aspect-ratio: 4 / 5; max-width: 100%; background: var(--tint); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph-empty { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 18%; }
.info { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.info h2 { font-family: var(--font-display); font-size: clamp(24px, 5vw, 32px); line-height: 1.2; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.care { margin: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.care > div { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.care dt { font-size: 13px; font-weight: 600; color: var(--accent); }
.care dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sec { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; min-width: 0; }
.sec h3 { font-family: var(--font-display); font-size: 19px; margin: 0; display: flex; justify-content: space-between; align-items: baseline; }
.sec .memo { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.g-add { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
@media (max-width: 560px) { .g-add { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .g-add .btn { grid-column: 1 / -1; } }
.g-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
.g-item { display: flex; flex-direction: column; gap: 4px; text-align: left; background: transparent; border: 0; padding: 0; cursor: pointer; min-width: 0; }
.g-item .ph { aspect-ratio: 1 / 1; }
.g-item .d { font-family: var(--font-mono); font-size: 11px; }
.g-item .cap { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.form { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label, .lbl { font-size: 13px; font-weight: 600; color: var(--accent); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
@media (max-width: 480px) { .two { grid-template-columns: minmax(0, 1fr); } }
.res-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 4px; background: var(--card); max-height: 220px; overflow-y: auto; }
.res { display: flex; align-items: center; gap: 10px; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 8px 10px; cursor: pointer; min-width: 0; }
.res:last-child { border-bottom: 0; }
.res:hover { background: var(--tint); }
.res img { width: 40px; height: 40px; object-fit: cover; border-radius: 3px; flex: none; }
.res span { overflow-wrap: anywhere; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }
input[type="color"] { width: 44px; height: 34px; padding: 2px; }
.lb { z-index: 30; background: rgba(6, 12, 8, .85); }
.lbp { max-width: 720px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.lbp img { width: 100%; max-height: 68vh; object-fit: contain; background: var(--tint); border-radius: 4px; display: block; }
.lbp p { margin: 0; overflow-wrap: anywhere; }
#toast { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; justify-content: center; padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px)); pointer-events: none; opacity: 0; transition: opacity .2s; }
#toast.on { opacity: 1; }
#toast span { background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 4px; font-size: 14px; max-width: 100%; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topline"><button type="button" class="iconbtn" data-act="settings" aria-label="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button></div>
    <div class="title-row">
      <svg class="sprig" viewBox="0 0 80 60" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 54C26 44 46 30 74 8"/><path d="M22 46c-2-8 2-14 9-16 1 8-2 14-9 16zM36 38c-1-8 3-14 10-15 0 8-3 13-10 15zM50 28c0-7 4-12 10-13-1 7-4 11-10 13zM28 40c6 1 12-2 15-8-7-2-13 1-15 8z"/></g></svg>
      <div class="tt"><h1>나의 식물 도감</h1><p class="sub">MY PLANT COLLECTION</p></div>
      <svg class="sprig r" viewBox="0 0 80 60" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 54C26 44 46 30 74 8"/><path d="M22 46c-2-8 2-14 9-16 1 8-2 14-9 16zM36 38c-1-8 3-14 10-15 0 8-3 13-10 15zM50 28c0-7 4-12 10-13-1 7-4 11-10 13zM28 40c6 1 12-2 15-8-7-2-13 1-15 8z"/></g></svg>
    </div>
    <div class="rule"></div>
  </header>
  <nav class="tabs" aria-label="도감 보기">
    <button type="button" class="btn primary" data-act="new">＋ 식물 추가</button>
    <div class="seg" role="group" aria-label="보기 방식"><button type="button" data-view="all" aria-pressed="true">전체 목록</button><button type="button" data-view="group" aria-pressed="false">종류별</button></div>
    <span class="count" id="count"></span>
  </nav>
  <main><div id="list"></div><p class="msg" id="msg" role="status"></p></main>
</div>

<div class="overlay" id="sheet" hidden><div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div id="sheet-body"></div></div></div>
<div class="overlay" id="settings" hidden>
  <div class="panel small" role="dialog" aria-modal="true" aria-labelledby="set-title">
    <div class="sheet-bar"><h2 id="set-title">설정</h2><button type="button" class="btn small" data-act="set-close" id="set-close">닫기</button></div>
    <div class="body">
      <div class="form"><span class="lbl">배경색</span>
        <div class="row" id="swatches"></div>
        <div class="row"><label for="bg-custom" class="note">직접 고르기</label><input type="color" id="bg-custom" value="#f6f1e3" aria-label="배경색 직접 고르기"><button type="button" class="btn small" data-act="color-reset">기본색</button></div>
      </div>
      <form class="form sec" id="lockform">
        <span class="lbl">편집 잠금</span>
        <p class="note" id="lock-state">지금은 보기 전용이에요. 식물 추가·수정, 물 준 날짜, 사진 올리기는 비밀번호를 입력하면 쓸 수 있어요.</p>
        <div class="row" id="pw-row"><input type="password" id="pw" autocomplete="current-password" placeholder="편집 비밀번호" style="flex:1 1 180px;width:auto"><button type="submit" class="btn primary small" id="pw-ok">편집 열기</button></div>
        <div class="row" id="relock-row" hidden><button type="button" class="btn small" data-act="relock">편집 잠그기</button></div>
      </form>
    </div>
  </div>
</div>
<div class="overlay lb" id="lightbox" hidden></div>
<div id="toast"><span></span></div>

<script src="config.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var CFG = window.PLANT_CONFIG || {};
  var URL_OK = /^https:\/\/script\.google\.com\/.+\/exec/.test(CFG.WEB_APP_URL || "");
  var DEFAULT_BG = "#F6F1E3";
  var PRESETS = [["종이", "#F6F1E3"], ["이슬", "#E3EBE0"], ["안개", "#E3E9EF"], ["연보라", "#EAE5F0"], ["살구", "#F2E5DD"], ["숲", "#16241B"], ["먹", "#1E2023"]];
  var state = { plants: [], loaded: false, err: "", view: "all", openId: null, mode: "view", confirm: null, pendingFile: null, busy: false, lb: null, apiId: "" };
  var unlocked = false, pw = "", settingsBg = null, lastFocus = null;

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  /* ---------- 서버 ---------- */
  async function loadList() {
    var res = await fetch(CFG.WEB_APP_URL + "?action=list");
    var j = await res.json();
    if (!j.ok) throw new Error(j.error || "목록을 불러오지 못했어요.");
    return j;
  }
  async function api(action, payload) {
    var res = await fetch(CFG.WEB_APP_URL, { method: "POST", body: JSON.stringify(Object.assign({ action: action, password: pw }, payload || {})) });
    var j = await res.json();
    if (!j.ok) {
      if (j.code === "bad_password") { unlocked = false; lsDel("plantdex.pw"); pw = ""; syncLock(); render(); }
      throw new Error(j.error || "요청에 실패했어요.");
    }
    return j;
  }

  /* ---------- 색 ---------- */
  function hex2rgb(h) { var n = parseInt(h.replace("#", ""), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function rgb2hex(r) { return "#" + r.map(function (v) { return Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0"); }).join(""); }
  function mix(a, b, t) { var A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(A.map(function (v, i) { return v * t + B[i] * (1 - t); })); }
  function lum(h) { var c = hex2rgb(h).map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
  function applyBg(bg) {
    if (!/^#[0-9a-f]{6}$/i.test(bg || "")) bg = DEFAULT_BG;
    var dark = lum(bg) < 0.18, fg = dark ? "#EAF1EA" : "#1F3326", accent = dark ? "#9ED3A6" : "#2F6B43", s = document.documentElement.style;
    s.setProperty("--bg", bg); s.setProperty("--fg", fg);
    s.setProperty("--muted", mix(fg, bg, 0.68));
    s.setProperty("--card", dark ? mix("#ffffff", bg, 0.07) : mix("#ffffff", bg, 0.55));
    s.setProperty("--line", mix(fg, bg, 0.2));
    s.setProperty("--accent", accent); s.setProperty("--accent-fg", dark ? "#10200F" : "#FFFFFF");
    s.setProperty("--tint", mix(accent, bg, 0.14));
    s.setProperty("--danger", dark ? "#F0A093" : "#A8382B");
    s.setProperty("--leafL", dark ? "68%" : "36%");
    s.colorScheme = dark ? "dark" : "light";
    var inp = $("#bg-custom"); if (inp) inp.value = bg.toLowerCase();
    var sw = document.querySelectorAll(".sw");
    for (var i = 0; i < sw.length; i++) sw[i].setAttribute("aria-pressed", sw[i].getAttribute("data-bg").toLowerCase() === bg.toLowerCase() ? "true" : "false");
  }
  function applyEffective() { applyBg(lsGet("plantdex.bg") || settingsBg || DEFAULT_BG); }
  function saveBg(bg) { lsSet("plantdex.bg", bg); if (unlocked) api("setBg", { bg: bg }).catch(function () {}); }

  /* ---------- 도우미 ---------- */
  var tt;
  function toast(m) { var t = $("#toast"); t.firstElementChild.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove("on"); }, 3200); }
  function pad2(n) { return String(n || 0).padStart(2, "0"); }
  function today() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function fmtDate(s) { return s ? String(s).replace(/-/g, ".") : ""; }
  function ago(s) { if (!s) return ""; var d = Math.round((new Date(today() + "T00:00:00") - new Date(s + "T00:00:00")) / 864e5); if (isNaN(d)) return ""; return d <= 0 ? "오늘" : d + "일 전"; }
  function imgUrl(id, w) { return "https://drive.google.com/thumbnail?id=" + encodeURIComponent(id) + "&sz=w" + (w || 800); }
  function fullName(p) { var g = p.group || ""; return (!g || g === "기타" || (p.name || "").indexOf(g) === 0) ? p.name : g + " " + p.name; }
  function cur() { for (var i = 0; i < state.plants.length; i++) if (state.plants[i].id === state.openId) return state.plants[i]; return null; }
  function putPlant(p) {
    var found = false;
    state.plants = state.plants.map(function (x) { if (x.id === p.id) { found = true; return p; } return x; });
    if (!found) state.plants.push(p);
    state.plants.sort(function (a, b) { return a.no - b.no; });
  }
  function leaf(g) {
    var h = 70, i; g = g || "";
    for (i = 0; i < g.length; i++) h = (h * 31 + g.charCodeAt(i)) % 100;
    h = 70 + h;
    return '<svg viewBox="0 0 80 80" aria-hidden="true" style="color:hsl(' + h + ' 34% var(--leafL))"><g fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M40 72V30" fill="none"/><path d="M40 52c-12 0-20-8-20-20 12 0 20 8 20 20zM40 42c12 0 20-8 20-20-12 0-20 8-20 20zM40 64c-9 0-15-6-15-15 9 0 15 6 15 15zM40 30c-6-5-6-13 0-20 6 7 6 15 0 20z"/></g></svg>';
  }
  function photoOrLeaf(id, g, w) {
    return id ? '<img src="' + imgUrl(id, w) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" data-ph="' + esc(g || "") + '">' : leaf(g);
  }
  document.addEventListener("error", function (e) {
    var t = e.target;
    if (!t || t.tagName !== "IMG" || !t.hasAttribute("data-ph")) return;
    var g = t.getAttribute("data-ph");
    if (g === "\u0000") { t.remove(); return; }
    var d = document.createElement("div"); d.className = "ph-empty"; d.innerHTML = leaf(g); t.replaceWith(d);
  }, true);

  /* ---------- 사진 ---------- */
  async function prepare(file) {
    var bmp = await createImageBitmap(file), s = Math.min(1, 1400 / Math.max(bmp.width, bmp.height)), c = document.createElement("canvas");
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    var blob = await new Promise(function (r) { c.toBlob(r, "image/jpeg", 0.85); });
    if (!blob) throw new Error("x");
    return blob;
  }
  function toBase64(blob) {
    return new Promise(function (res, rej) { var fr = new FileReader(); fr.onload = function () { res(String(fr.result).split(",")[1] || ""); }; fr.onerror = function () { rej(new Error("사진을 읽지 못했어요.")); }; fr.readAsDataURL(blob); });
  }
  async function uploadPhoto(plantId, file, extra) {
    var blob;
    try { blob = await prepare(file); } catch (e) { throw new Error("이 사진 형식은 읽을 수 없어요. JPG나 PNG로 올려 주세요."); }
    var data = await toBase64(blob);
    return (await api("uploadPhoto", Object.assign({ plantId: plantId, mime: "image/jpeg", filename: "plant-" + Date.now() + ".jpg", data: data }, extra))).plant;
  }

  /* ---------- 목록 ---------- */
  function cell(p, full) {
    return '<button type="button" class="cell" data-open="' + esc(p.id) + '"><span class="n">' + pad2(p.no) + '.</span><span class="art">' + photoOrLeaf(p.photo, p.group, 400) + '</span><span class="nm">' + esc(full ? fullName(p) : p.name) + "</span></button>";
  }
  function render() {
    var n = state.plants.length, html = "", btns = document.querySelectorAll("[data-view]"), i;
    for (i = 0; i < btns.length; i++) btns[i].setAttribute("aria-pressed", btns[i].getAttribute("data-view") === state.view ? "true" : "false");
    $("#count").textContent = state.loaded ? "총 " + n + "종" : "";
    if (state.view === "all") html = '<div class="grid">' + state.plants.map(function (p) { return cell(p, true); }).join("") + "</div>";
    else {
      var m = new Map();
      state.plants.forEach(function (p) { var g = p.group || "기타"; if (!m.has(g)) m.set(g, []); m.get(g).push(p); });
      m.forEach(function (list, g) { html += '<section class="grp"><h2>' + esc(g) + '<span class="gc">' + list.length + '종</span></h2><div class="grid">' + list.map(function (p) { return cell(p, false); }).join("") + "</div></section>"; });
    }
    $("#list").innerHTML = html;
    var msg = state.err || (!state.loaded ? "도감을 불러오는 중이에요." : (!n ? "아직 등록한 식물이 없어요. 위의 ‘식물 추가’로 첫 식물을 등록해 보세요." : ""));
    $("#msg").textContent = msg; $("#msg").hidden = !msg;
  }

  /* ---------- 상세 ---------- */
  function careRow(label, v) { return "<div><dt>" + label + "</dt><dd>" + (v ? esc(v) : '<span class="empty">아직 적지 않았어요</span>') + "</dd></div>"; }
  function viewHtml(p) {
    var g = (p.growth || []).slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    var wv = p.watered ? esc(fmtDate(p.watered)) + " (" + ago(p.watered) + ")" : '<span class="empty">기록이 없어요</span>';
    if (unlocked) wv += '<div class="row" style="margin-top:6px"><button type="button" class="btn small" data-act="water">오늘 물 줬어요</button></div>';
    var h = '<div class="sheet-bar"><span class="no note">No. ' + pad2(p.no) + " · " + esc(p.group || "기타") + '</span><button type="button" class="btn small" data-act="close" id="sheet-close">닫기</button></div><div class="body"><div class="top2"><div class="info"><span class="ph">' + photoOrLeaf(p.photo, p.group, 900) + "</span>" +
      (unlocked ? '<div><label class="btn small" for="up-main">대표 사진 바꾸기</label><input id="up-main" type="file" accept="image/*" hidden></div>' : "") + '</div><div class="info"><h2 id="sheet-title">' + esc(fullName(p)) + "</h2>" +
      '<dl class="care"><div><dt>물 준 날짜</dt><dd>' + wv + "</dd></div>" + careRow("물 주기", p.water) + careRow("햇빛", p.light) + careRow("관리 방법", p.care) + "</dl>" +
      (p.guide ? '<p class="note">기본 가이드를 먼저 채워 두었어요. 키우는 환경에 맞게 수정해 주세요.</p>' : "");
    if (unlocked) {
      if (state.confirm === "plant") h += '<div class="row"><span>이 식물과 사진을 삭제할까요?</span><button type="button" class="btn danger small" data-act="del-yes">삭제</button><button type="button" class="btn small" data-act="del-no">취소</button></div>';
      else h += '<div class="row"><button type="button" class="btn primary" data-act="edit">수정</button><button type="button" class="btn danger small" data-act="del">삭제</button></div>';
    }
    h += '</div></div><section class="sec"><h3>참고 사항</h3>' + (p.memo ? '<p class="memo">' + esc(p.memo) + "</p>" : '<p class="empty">적어 둔 내용이 없어요.</p>') + "</section>";
    h += '<section class="sec"><h3>성장 사진<span class="note">' + g.length + "장</span></h3>";
    if (unlocked) h += '<div class="g-add"><input id="g-date" type="date" value="' + today() + '" aria-label="촬영한 날짜"><input id="g-note" type="text" placeholder="메모 (선택)" aria-label="성장 사진 메모" autocomplete="off"><label class="btn primary" for="g-file">사진 추가</label><input id="g-file" type="file" accept="image/*" hidden></div>';
    if (g.length) h += '<div class="g-grid">' + g.map(function (x) { return '<button type="button" class="g-item" data-gid="' + esc(x.id) + '"><span class="ph"><img src="' + imgUrl(x.file, 400) + '" alt="' + esc(fullName(p)) + " " + fmtDate(x.date) + '" loading="lazy" decoding="async" referrerpolicy="no-referrer" data-ph="' + esc(p.group || "") + '"></span><span class="d">' + fmtDate(x.date) + "</span>" + (x.note ? '<span class="cap">' + esc(x.note) + "</span>" : "") + "</button>"; }).join("") + "</div>";
    else h += '<p class="empty">아직 성장 사진이 없어요.' + (unlocked ? " 날짜를 고르고 사진을 추가해 보세요." : "") + "</p>";
    return h + "</section></div>";
  }
  function formHtml(p) {
    var isNew = state.mode === "new", gl = "", seen = {};
    state.plants.forEach(function (x) { var g = x.group || "기타"; if (!seen[g]) { seen[g] = 1; gl += '<option value="' + esc(g) + '">'; } });
    function ta(id, label, v, ph) { return '<div class="field"><label for="' + id + '">' + label + '</label><textarea id="' + id + '" placeholder="' + ph + '">' + esc(v || "") + "</textarea></div>"; }
    return '<div class="sheet-bar"><h2 id="sheet-title">' + (isNew ? "새 식물" : "식물 수정") + '</h2><button type="button" class="btn small" data-act="cancel" id="sheet-close">취소</button></div>' +
      '<form class="body top2" id="plant-form" autocomplete="off"><div class="info"><span class="ph" id="f-prev">' + photoOrLeaf(p.photo, p.group, 900) + '</span><div class="row"><label class="btn small" for="f-photo">대표 사진 선택</label><input id="f-photo" type="file" accept="image/*" hidden><span class="note" id="f-photo-name"></span></div></div>' +
      '<div class="form"><div class="field"><label for="f-name">이름</label><input id="f-name" required value="' + esc(p.name || "") + '" placeholder="예: 실테페카나"></div>' +
      '<div class="two"><div class="field"><label for="f-group">종류(그룹)</label><input id="f-group" list="f-groups" value="' + esc(p.group || "") + '" placeholder="예: 몬스테라"><datalist id="f-groups">' + gl + '</datalist></div><div class="field"><label for="f-wat">물 준 날짜</label><input id="f-wat" type="date" value="' + esc(p.watered || "") + '"></div></div>' +
      '<div class="field"><label for="f-acq">들인 날</label><input id="f-acq" type="date" value="' + esc(p.acquired || "") + '"></div>' +
      '<div class="field"><label for="s-q">관리법 검색 (농사로)</label><div class="row"><input id="s-q" type="search" placeholder="식물 이름 (예: 몬스테라)" style="flex:1 1 160px;width:auto"><button type="button" class="btn small" data-act="search" id="s-go">검색</button></div><div id="s-res"></div></div>' +
      ta("f-water", "물 주기", p.water, "예: 겉흙이 마르면 듬뿍") + ta("f-light", "햇빛", p.light, "예: 밝은 간접광") + ta("f-care", "관리 방법", p.care, "예: 통풍, 비료, 분갈이 시기") + ta("f-memo", "참고 사항", p.memo, "자유롭게 적어요") +
      '<div class="row"><button type="submit" class="btn primary" id="f-save"' + (state.busy ? " disabled" : "") + ">" + (isNew ? "등록" : "저장") + "</button></div></div></form>";
  }
  function renderSheet() {
    var p = state.mode === "new" ? {} : cur();
    if (!p) { closeSheet(); return; }
    $("#sheet-body").innerHTML = state.mode === "view" ? viewHtml(p) : formHtml(p);
  }
  function openSheet(id, mode) {
    lastFocus = document.activeElement;
    state.openId = id; state.mode = mode; state.confirm = null; state.pendingFile = null; state.apiId = "";
    if (mode === "edit") { var c = cur(); state.apiId = (c && c.apiId) || ""; }
    renderSheet();
    $("#sheet").hidden = false; document.documentElement.classList.add("lock"); $("#sheet").scrollTop = 0;
    var cb = $("#sheet-close"); if (cb) cb.focus();
  }
  function closeSheet() {
    $("#sheet").hidden = true; $("#lightbox").hidden = true; state.lb = null;
    document.documentElement.classList.remove("lock");
    state.openId = null; state.mode = "view"; state.confirm = null; state.pendingFile = null;
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
  }
  function renderLb() {
    var lb = $("#lightbox"), p = cur();
    if (!state.lb || !p) { lb.hidden = true; return; }
    var it = (p.growth || []).filter(function (x) { return x.id === state.lb.gid; })[0];
    if (!it) { lb.hidden = true; state.lb = null; return; }
    var del = "";
    if (unlocked) del = state.lb.confirm ? '<span>이 사진을 삭제할까요?</span><button type="button" class="btn danger small" data-act="lb-del-yes">삭제</button><button type="button" class="btn small" data-act="lb-del-no">취소</button>' : '<button type="button" class="btn danger small" data-act="lb-del">삭제</button>';
    lb.innerHTML = '<div class="panel lbp" role="dialog" aria-modal="true" aria-label="성장 사진"><img src="' + imgUrl(it.file, 1400) + '" alt="' + esc(fullName(p)) + " " + fmtDate(it.date) + '" referrerpolicy="no-referrer"><p class="note">' + esc(fullName(p)) + " · " + fmtDate(it.date) + "</p>" + (it.note ? "<p>" + esc(it.note) + "</p>" : "") + '<div class="row"><button type="button" class="btn small" data-act="lb-close">닫기</button>' + del + "</div></div>";
    lb.hidden = false;
  }

  /* ---------- 편집 동작 ---------- */
  function readForm() {
    var g = function (id) { return $("#" + id).value; };
    return { name: g("f-name").trim(), group: g("f-group").trim() || "기타", acquired: g("f-acq"), watered: g("f-wat"), water: g("f-water").trim(), light: g("f-light").trim(), care: g("f-care").trim(), memo: g("f-memo").trim() };
  }
  async function savePlant() {
    if (state.busy) return;
    var v = readForm();
    if (!v.name) { toast("이름을 입력해 주세요"); $("#f-name").focus(); return; }
    var isNew = state.mode === "new", p = isNew ? {} : cur();
    state.busy = true; $("#f-save").disabled = true;
    try {
      var payload = Object.assign({}, v, { guide: false, apiId: state.apiId || "" });
      if (!isNew) payload.id = p.id;
      var saved = (await api("save", { plant: payload })).plant;
      if (state.pendingFile) {
        toast("사진을 올리는 중이에요");
        try { saved = await uploadPhoto(saved.id, state.pendingFile, { kind: "main" }); } catch (e) { toast("식물은 저장했지만 사진은 올리지 못했어요. " + e.message); }
      }
      putPlant(saved);
      state.openId = saved.id; state.mode = "view"; state.pendingFile = null; state.busy = false;
      render(); renderSheet(); toast(isNew ? "식물을 등록했어요" : "저장했어요");
    } catch (e) { state.busy = false; var b = $("#f-save"); if (b) b.disabled = false; toast(e.message); }
  }
  async function deletePlant() {
    var p = cur(); if (!p) return;
    try { await api("delete", { id: p.id }); state.plants = state.plants.filter(function (x) { return x.id !== p.id; }); closeSheet(); render(); toast("삭제했어요"); } catch (e) { toast(e.message); }
  }
  async function waterToday() {
    var p = cur(); if (!p) return;
    try { putPlant((await api("save", { plant: { id: p.id, name: p.name, watered: today() } })).plant); renderSheet(); toast("물 준 날짜를 오늘로 기록했어요"); } catch (e) { toast(e.message); }
  }
  async function setMainPhoto(file) {
    var p = cur(); if (!p) return; toast("사진을 올리는 중이에요");
    try { putPlant(await uploadPhoto(p.id, file, { kind: "main" })); render(); renderSheet(); toast("대표 사진을 바꿨어요"); } catch (e) { toast(e.message); }
  }
  async function addGrowth(file) {
    var p = cur(); if (!p) return;
    var date = ($("#g-date") && $("#g-date").value) || today(), note = ($("#g-note") && $("#g-note").value.trim()) || "";
    toast("사진을 올리는 중이에요");
    try { putPlant(await uploadPhoto(p.id, file, { kind: "growth", date: date, note: note })); renderSheet(); render(); toast("성장 사진을 추가했어요"); } catch (e) { toast(e.message); }
  }
  async function deleteGrowth() {
    var p = cur(); if (!p || !state.lb) return;
    try { putPlant((await api("deleteGrowth", { plantId: p.id, growthId: state.lb.gid })).plant); state.lb = null; renderLb(); renderSheet(); toast("사진을 삭제했어요"); } catch (e) { toast(e.message); }
  }
  async function searchPlants() {
    var q = $("#s-q").value.trim(), box = $("#s-res");
    if (!q) { toast("검색할 식물 이름을 입력해 주세요"); return; }
    $("#s-go").disabled = true; box.innerHTML = '<p class="note">검색 중이에요.</p>';
    try {
      var items = (await api("search", { q: q })).items || [];
      box.innerHTML = !items.length ? '<p class="note">검색 결과가 없어요. ‘몬스테라’처럼 짧은 이름으로 찾아 보세요.</p>' : '<div class="res-list">' + items.map(function (it) {
        return '<button type="button" class="res" data-pick="' + esc(it.id) + '">' + (it.thumb ? '<img src="' + esc(String(it.thumb).replace(/^http:/, "https:")) + '" alt="" data-ph="\u0000" referrerpolicy="no-referrer">' : "") + "<span>" + esc(it.name) + "</span></button>";
      }).join("") + "</div>";
    } catch (e) { box.innerHTML = '<p class="note">' + esc(e.message) + "</p>"; }
    var b = $("#s-go"); if (b) b.disabled = false;
  }
  async function pickPlant(id) {
    toast("관리법을 가져오는 중이에요");
    try {
      var d = (await api("detail", { id: id })).detail || {};
      if (d.water) $("#f-water").value = d.water;
      if (d.light) $("#f-light").value = d.light;
      if (d.care) $("#f-care").value = d.care;
      state.apiId = id; $("#s-res").innerHTML = "";
      toast(d.water || d.light || d.care ? "관리법을 채웠어요. 확인하고 저장하세요" : "받아온 관리 정보가 비어 있어요");
    } catch (e) { toast(e.message); }
  }

  /* ---------- 설정·잠금 ---------- */
  function syncLock() {
    $("#lock-state").textContent = unlocked ? "편집이 열려 있어요. 식물 추가·수정, 물 준 날짜, 사진 올리기를 할 수 있어요." : "지금은 보기 전용이에요. 식물 추가·수정, 물 준 날짜, 사진 올리기는 비밀번호를 입력하면 쓸 수 있어요.";
    $("#pw-row").hidden = unlocked; $("#relock-row").hidden = !unlocked;
  }
  function openSettings() { lastFocus = document.activeElement; syncLock(); $("#settings").hidden = false; document.documentElement.classList.add("lock"); (unlocked ? $("#set-close") : $("#pw")).focus(); }
  function closeSettings() { $("#settings").hidden = true; if ($("#sheet").hidden) document.documentElement.classList.remove("lock"); if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} } }
  async function tryUnlock(candidate) {
    if (!candidate) { toast("비밀번호를 입력해 주세요"); return; }
    pw = candidate; $("#pw-ok").disabled = true;
    try { await api("check"); unlocked = true; lsSet("plantdex.pw", pw); $("#pw").value = ""; syncLock(); if (!$("#sheet").hidden) renderSheet(); toast("편집할 수 있어요"); }
    catch (e) { pw = ""; toast(e.message); }
    $("#pw-ok").disabled = false;
  }

  /* ---------- 이벤트 ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-open],[data-view],[data-act],[data-gid],[data-bg],[data-pick]");
    if (!t) { if (e.target.id === "sheet") closeSheet(); else if (e.target.id === "settings") closeSettings(); else if (e.target.id === "lightbox") { state.lb = null; renderLb(); } return; }
    if (t.hasAttribute("data-open")) return openSheet(t.getAttribute("data-open"), "view");
    if (t.hasAttribute("data-view")) { state.view = t.getAttribute("data-view"); lsSet("plantdex.view", state.view); return render(); }
    if (t.hasAttribute("data-gid")) { state.lb = { gid: t.getAttribute("data-gid"), confirm: false }; return renderLb(); }
    if (t.hasAttribute("data-bg")) { var c = t.getAttribute("data-bg"); applyBg(c); saveBg(c); return; }
    if (t.hasAttribute("data-pick")) return pickPlant(t.getAttribute("data-pick"));
    var a = t.getAttribute("data-act");
    if (a === "settings") openSettings();
    else if (a === "set-close") closeSettings();
    else if (a === "new") { if (!URL_OK || !state.loaded) { toast("도감이 아직 연결되지 않았어요"); } else if (!unlocked) { toast("식물을 추가하려면 편집 비밀번호가 필요해요"); openSettings(); } else openSheet(null, "new"); }
    else if (a === "close") closeSheet();
    else if (a === "edit") openSheet(state.openId, "edit");
    else if (a === "cancel") { if (state.mode === "new") closeSheet(); else { state.mode = "view"; state.pendingFile = null; renderSheet(); } }
    else if (a === "del") { state.confirm = "plant"; renderSheet(); }
    else if (a === "del-no") { state.confirm = null; renderSheet(); }
    else if (a === "del-yes") deletePlant();
    else if (a === "water") waterToday();
    else if (a === "search") searchPlants();
    else if (a === "lb-close") { state.lb = null; renderLb(); }
    else if (a === "lb-del") { state.lb.confirm = true; renderLb(); }
    else if (a === "lb-del-no") { state.lb.confirm = false; renderLb(); }
    else if (a === "lb-del-yes") deleteGrowth();
    else if (a === "color-reset") { applyBg(DEFAULT_BG); saveBg(DEFAULT_BG); lsDel("plantdex.bg"); }
    else if (a === "relock") { unlocked = false; pw = ""; lsDel("plantdex.pw"); syncLock(); render(); if (!$("#sheet").hidden) renderSheet(); toast("편집을 잠갔어요"); }
  });
  document.addEventListener("change", function (e) {
    var t = e.target, f = t.files && t.files[0];
    if (t.id === "bg-custom") saveBg(t.value);
    else if (t.id === "up-main" && f) { setMainPhoto(f); t.value = ""; }
    else if (t.id === "g-file" && f) { addGrowth(f); t.value = ""; }
    else if (t.id === "f-photo" && f) { state.pendingFile = f; $("#f-photo-name").textContent = f.name; $("#f-prev").innerHTML = '<img src="' + URL.createObjectURL(f) + '" alt="">'; }
  });
  document.addEventListener("input", function (e) { if (e.target.id === "bg-custom") { applyBg(e.target.value); lsSet("plantdex.bg", e.target.value); } });
  document.addEventListener("submit", function (e) {
    if (e.target.id === "plant-form") { e.preventDefault(); savePlant(); }
    else if (e.target.id === "lockform") { e.preventDefault(); tryUnlock($("#pw").value); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.id === "s-q") { e.preventDefault(); searchPlants(); return; }
    if (e.key !== "Escape") return;
    if (!$("#lightbox").hidden) { state.lb = null; renderLb(); }
    else if (!$("#settings").hidden) closeSettings();
    else if (!$("#sheet").hidden) closeSheet();
  });

  /* ---------- 시작 ---------- */
  $("#swatches").innerHTML = PRESETS.map(function (p) { return '<button type="button" class="sw" data-bg="' + p[1] + '" style="background:' + p[1] + '" aria-label="' + p[0] + '" title="' + p[0] + '" aria-pressed="false"></button>'; }).join("");
  var v = lsGet("plantdex.view"); if (v === "group" || v === "all") state.view = v;
  applyEffective(); render();
  (async function boot() {
    if (!URL_OK) { state.err = "아직 웹 앱 주소가 연결되지 않았어요.\nconfig.js 파일의 WEB_APP_URL에 구글 앱스 스크립트 웹 앱 URL을 붙여넣어 주세요. (설명서 5단계)"; render(); return; }
    try { var j = await loadList(); state.plants = j.plants || []; settingsBg = (j.settings || {}).bg || null; state.loaded = true; applyEffective(); render(); }
    catch (e) { state.err = "도감을 불러오지 못했어요.\n웹 앱 URL과 배포 설정(액세스: 모든 사용자)을 확인해 주세요.\n" + e.message; render(); return; }
    var saved = lsGet("plantdex.pw");
    if (saved) { pw = saved; try { await api("check"); unlocked = true; syncLock(); } catch (e) { pw = ""; } }
  })();
})();
</script>
</body>
</html>
