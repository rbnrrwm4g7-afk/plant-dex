<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 식물 도감</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&family=Gaegu:wght@400;700&family=Jua&family=Song+Myung&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: centered two-line title (editable), a small centered row of menu tabs (add / all / by group / album), then framed plate cards: picture in its own frame, name below, point-colored outer border. */
:root {
  --bg: #F6F1E3; --fg: #1F3326; --muted: #5F6B5E; --line: #D6D0BC; --card: #FCFAF2;
  --accent: #2F6B43; --accent-fg: #FFFFFF; --tint: #E8E6D2; --danger: #A8382B;
  --plate: #FCFAF2; --platefg: #1F3326; --plateline: #8E8A6A;
  --tab: #FCFAF2; --tabfg: #1F3326; --tabon: #2F6B43; --tabonfg: #FFFFFF;
  --paper: #FBF9F4;
  --font-display: "Gowun Batang", "Noto Serif KR", serif;
  --font-body: "IBM Plex Sans KR", "Noto Sans KR", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
html.lock { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-block: max(14px, env(safe-area-inset-top, 0px)) 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
img { max-width: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.topline { display: flex; justify-content: flex-end; }
.iconbtn { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid var(--line); border-radius: 50%; cursor: pointer; }
.iconbtn:hover { border-color: var(--accent); }
.iconbtn svg { width: 19px; height: 19px; }
.titles { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
#t-main { margin: 0; line-height: 1.2; text-wrap: balance; overflow-wrap: anywhere; font-weight: 700; }
#t-sub { margin: 0; letter-spacing: .2em; overflow-wrap: anywhere; }
.rule { height: 1px; background: var(--line); }

.nav { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; }
.mt { min-height: 32px; padding: 4px 12px; font-size: 13px; font-weight: 500; background: var(--tab); color: var(--tabfg); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
.mt:hover { border-color: var(--accent); }
.mt[aria-pressed="true"] { background: var(--tabon); color: var(--tabonfg); border-color: var(--tabon); }
.count { font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; color: var(--muted); padding-left: 4px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 14px; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; font-weight: 500; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.small { min-height: 34px; padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .55; cursor: default; }

input, textarea, select { font: inherit; font-size: 16px; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 9px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 70px; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
input[type="range"] { padding: 0; border: 0; background: transparent; accent-color: var(--accent); }
input[type="color"] { width: 44px; height: 34px; padding: 2px; flex: none; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 16px 14px; padding: 4px; }
.cell { display: flex; flex-direction: column; gap: 7px; padding: 7px 7px 9px; min-width: 0; text-align: center; cursor: pointer;
  background: var(--plate); color: var(--platefg); border: 1.5px solid var(--plateline); border-radius: 2px;
  box-shadow: 0 0 0 3px var(--bg), 0 0 0 4px var(--plateline); }
.cell:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--bg), 0 0 0 4px var(--accent); }
.art { display: block; aspect-ratio: 3 / 4; width: 100%; overflow: hidden; background: var(--paper); border: 1px solid var(--plateline); }
.art.sq { aspect-ratio: 1 / 1; }
.art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.art svg, .artfill svg { width: 100%; height: 100%; display: block; }
.artfill { display: block; width: 100%; height: 100%; }
.nm { font-family: var(--nm-font, var(--font-display)); font-size: var(--nm-size, 14px); line-height: 1.3; overflow-wrap: anywhere; padding: 0 2px; }
.nm small { display: block; font-family: var(--font-mono); font-size: 10px; opacity: .7; margin-top: 2px; }
.grp { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
.grp h2 { font-family: var(--font-display); font-size: 20px; margin: 0; display: flex; align-items: baseline; gap: 8px; }
.gc { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.msg { padding: 28px 0; color: var(--muted); white-space: pre-wrap; text-align: center; }
.empty { color: var(--muted); }

.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(10, 18, 13, .58); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.panel { position: relative; width: 100%; max-width: 860px; margin: auto 0; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; }
.panel.small { max-width: 480px; }
.sheet-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 10px 0 16px; }
.sheet-bar h2 { font-family: var(--font-display); font-size: 20px; margin: 0; }
.body { padding: 10px 18px 22px; display: flex; flex-direction: column; gap: 18px; }
.top2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
@media (min-width: 720px) { .top2 { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 26px; } }
.ph { display: block; aspect-ratio: 4 / 5; max-width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph svg { width: 100%; height: 100%; display: block; }
.info { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.info h2 { font-family: var(--font-display); font-size: clamp(24px, 5vw, 32px); line-height: 1.2; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.care { margin: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.care > div { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.care dt { font-size: 13px; font-weight: 600; color: var(--accent); }
.care dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sec { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; min-width: 0; }
.sec h3 { font-family: var(--font-display); font-size: 19px; margin: 0; display: flex; justify-content: space-between; align-items: baseline; }
.sec .memo { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.g-add { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
@media (max-width: 560px) { .g-add { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .g-add .btn { grid-column: 1 / -1; } }
.g-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
.g-item { display: flex; flex-direction: column; gap: 4px; text-align: left; background: transparent; border: 0; padding: 0; cursor: pointer; min-width: 0; }
.g-item .ph { aspect-ratio: 1 / 1; }
.g-item .d { font-family: var(--font-mono); font-size: 11px; }
.g-item .cap { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.form { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label, .lbl { font-size: 13px; font-weight: 600; color: var(--accent); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
@media (max-width: 480px) { .two { grid-template-columns: minmax(0, 1fr); } }
.srow { display: flex; align-items: center; gap: 8px; }
.srow label { flex: 1 1 auto; font-size: 14px; }
.srow select { flex: 0 1 190px; }
.srow input[type="range"] { flex: 0 1 190px; }
.res-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 4px; background: var(--card); max-height: 220px; overflow-y: auto; }
.res { display: flex; align-items: center; gap: 10px; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 8px 10px; cursor: pointer; min-width: 0; }
.res:last-child { border-bottom: 0; }
.res:hover { background: var(--tint); }
.res img { width: 40px; height: 40px; object-fit: cover; border-radius: 3px; flex: none; }
.res span { overflow-wrap: anywhere; }
.sw { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }
.lb { z-index: 30; background: rgba(6, 12, 8, .85); }
.overlay.z2 { z-index: 25; }
.chk { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 4px; }
.chk li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); }
.chk li:last-child { border-bottom: 0; }
.chk .mk { color: var(--accent); text-align: center; }
.chk small { display: block; color: var(--muted); font-size: 12px; }
.sum { margin: 0; overflow-wrap: anywhere; }
.lbp { max-width: 720px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.lbp img { width: 100%; max-height: 68vh; object-fit: contain; background: var(--paper); border-radius: 4px; display: block; }
.lbp p { margin: 0; overflow-wrap: anywhere; }
#toast { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; justify-content: center; padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px)); pointer-events: none; opacity: 0; transition: opacity .2s; }
#toast.on { opacity: 1; }
#toast span { background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 4px; font-size: 14px; max-width: 100%; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topline"><button type="button" class="iconbtn" data-act="settings" aria-label="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button></div>
    <div class="titles"><h1 id="t-main"></h1><p id="t-sub"></p></div>
    <div class="rule"></div>
  </header>
  <nav class="nav" aria-label="도감 메뉴">
    <button type="button" class="mt" data-act="new">식물 추가</button>
    <button type="button" class="mt" data-view="all" aria-pressed="true">전체 목록</button>
    <button type="button" class="mt" data-view="group" aria-pressed="false">종류별</button>
    <button type="button" class="mt" data-view="gallery" aria-pressed="false">사진첩</button>
    <span class="count" id="count"></span>
  </nav>
  <main><div id="list"></div><p class="msg" id="msg" role="status"></p></main>
</div>

<div class="overlay" id="sheet" hidden><div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div id="sheet-body"></div></div></div>
<div class="overlay" id="settings" hidden>
  <div class="panel small" role="dialog" aria-modal="true" aria-labelledby="set-title">
    <div class="sheet-bar"><h2 id="set-title">설정</h2><button type="button" class="btn small" data-act="set-close" id="set-close">닫기</button></div>
    <div class="body">
      <div class="srow"><button type="button" class="btn" data-act="conn-open">구글 시트 연결</button><span class="note" id="conn-mini"></span></div>
      <div id="set-design" class="body" style="padding:0"></div>
    </div>
  </div>
</div>
<div class="overlay z2" id="conn" hidden>
  <div class="panel small" role="dialog" aria-modal="true" aria-labelledby="cn-title">
    <div class="sheet-bar"><h2 id="cn-title">구글 시트 연결</h2><button type="button" class="btn small" data-act="conn-close" id="cn-close">닫기</button></div>
    <div class="body">
      <p class="sum" id="cn-sum"></p>
      <div class="form"><span class="lbl">연결 점검</span><ul class="chk" id="cn-chk"></ul></div>
      <div class="field"><label for="cn-url">웹앱 주소</label><input id="cn-url" type="url" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <div class="field"><label for="cn-pw">비밀번호</label><input id="cn-pw" type="password" autocomplete="current-password"><p class="note">Apps Script 맨 위 EDIT_PASSWORD에 적은 것과 같아야 해요.</p></div>
      <div class="row"><button type="button" class="btn danger" data-act="conn-cut">연결 끊기</button><button type="button" class="btn primary" data-act="conn-sync" id="cn-sync" style="flex:1">시트와 맞추기</button></div>
    </div>
  </div>
</div>
<div class="overlay lb" id="lightbox" hidden></div>
<div id="toast"><span></span></div>

<script src="config.js"></script>
<script>
(function () {

      var g = state.gl, gd = "";
      if (unlocked) gd = g.confirm ? '<span>이 사진을 삭제할까요?</span><button type="button" class="btn danger small" data-act="gl-del-yes">삭제</button><button type="button" class="btn small" data-act="gl-del-no">취소</button>' : '<button type="button" class="btn danger small" data-act="gl-del">삭제</button>';
      lb.innerHTML = '<div class="panel lbp" role="dialog" aria-modal="true" aria-label="사진"><img src="' + imgUrl(g.file, 1400) + '" alt="' + esc(g.note || "사진") + '" referrerpolicy="no-referrer"><p class="note">' + (g.date ? fmtDate(g.date) : "") + "</p>" + (g.note ? "<p>" + esc(g.note) + "</p>" : "") + '<div class="row"><button type="button" class="btn small" data-act="lb-close">닫기</button>' + gd + "</div></div>";
      lb.hidden = false; updateLock(); return;
    }
    if (!state.lb || !p) { lb.hidden = true; updateLock(); return; }
    it = (p.growth || []).filter(function (x) { return x.id === state.lb.gid; })[0];
    if (!it) { lb.hidden = true; state.lb = null; updateLock(); return; }
    if (unlocked) del = state.lb.confirm ? '<span>이 사진을 삭제할까요?</span><button type="button" class="btn danger small" data-act="lb-del-yes">삭제</button><button type="button" class="btn small" data-act="lb-del-no">취소</button>' : '<button type="button" class="btn danger small" data-act="lb-del">삭제</button>';
    lb.innerHTML = '<div class="panel lbp" role="dialog" aria-modal="true" aria-label="성장 사진"><img src="' + imgUrl(it.file, 1400) + '" alt="' + esc(fullName(p)) + " " + fmtDate(it.date) + '" referrerpolicy="no-referrer"><p class="note">' + esc(fullName(p)) + " · " + fmtDate(it.date) + "</p>" + (it.note ? "<p>" + esc(it.note) + "</p>" : "") + '<div class="row"><button type="button" class="btn small" data-act="lb-close">닫기</button>' + del + "</div></div>";
    lb.hidden = false; updateLock();
  }

  /* ---------- 편집 동작 ---------- */
  function readForm() {
    var g = function (id) { return $("#" + id).value; };
    return { name: g("f-name").trim(), group: g("f-group").trim() || "기타", acquired: g("f-acq"), watered: g("f-wat"), water: g("f-water").trim(), light: g("f-light").trim(), care: g("f-care").trim(), memo: g("f-memo").trim() };
  }
  async function savePlant() {
    if (state.busy) return;
    var v = readForm();
    if (!v.name) { toast("이름을 입력해 주세요"); $("#f-name").focus(); return; }
    var isNew = state.mode === "new", p = isNew ? {} : cur();
    state.busy = true; $("#f-save").disabled = true;
    try {
      var payload = Object.assign({}, v, { guide: false, apiId: state.apiId || "" });
      if (!isNew) payload.id = p.id;
      var saved = (await api("save", { plant: payload })).plant;
      if (state.pendingFile) {
        toast("사진을 올리는 중이에요");
        try { saved = await uploadPhoto(saved.id, state.pendingFile, { kind: "main" }); } catch (e) { toast("식물은 저장했지만 사진은 올리지 못했어요. " + e.message); }
      }
      putPlant(saved); state.openId = saved.id; state.mode = "view"; state.pendingFile = null; state.busy = false;
      render(); renderSheet(); toast(isNew ? "식물을 등록했어요" : "저장했어요");
    } catch (e) { state.busy = false; var b = $("#f-save"); if (b) b.disabled = false; toast(e.message); }
  }
  async function deletePlant() {
    var p = cur(); if (!p) return;
    try { await api("delete", { id: p.id }); state.plants = state.plants.filter(function (x) { return x.id !== p.id; }); closeSheet(); render(); toast("삭제했어요"); } catch (e) { toast(e.message); }
  }
  async function waterToday() {
    var p = cur(); if (!p) return;
    try { putPlant((await api("save", { plant: { id: p.id, name: p.name, watered: today() } })).plant); renderSheet(); toast("물 준 날짜를 오늘로 기록했어요"); } catch (e) { toast(e.message); }
  }
  async function setMainPhoto(file) {
    var p = cur(); if (!p) return; toast("사진을 올리는 중이에요");
    try { putPlant(await uploadPhoto(p.id, file, { kind: "main" })); render(); renderSheet(); toast("대표 사진을 바꿨어요"); } catch (e) { toast(e.message); }
  }
  async function addGrowth(file) {
    var p = cur(); if (!p) return;
    var date = ($("#g-date") && $("#g-date").value) || today(), note = ($("#g-note") && $("#g-note").value.trim()) || "";
    toast("사진을 올리는 중이에요");
    try { putPlant(await uploadPhoto(p.id, file, { kind: "growth", date: date, note: note })); renderSheet(); render(); toast("성장 사진을 추가했어요"); } catch (e) { toast(e.message); }
  }
  async function deleteGrowth() {
    var p = cur(); if (!p || !state.lb) return;
    try { putPlant((await api("deleteGrowth", { plantId: p.id, growthId: state.lb.gid })).plant); state.lb = null; renderLb(); renderSheet(); render(); toast("사진을 삭제했어요"); } catch (e) { toast(e.message); }
  }
  async function addAlbum(files) {
    var date = ($("#a-date") && $("#a-date").value) || today(), note = ($("#a-note") && $("#a-note").value.trim()) || "", i, ok = 0;
    try {
      if (!albumPlant) albumPlant = (await api("save", { plant: { name: "사진첩", group: ALBUM } })).plant;
      for (i = 0; i < files.length; i++) {
        toast("사진을 올리는 중이에요 (" + (i + 1) + "/" + files.length + ")");
        albumPlant = await uploadPhoto(albumPlant.id, files[i], { kind: "growth", date: date, note: note }); ok++;
      }
      render(); toast(ok + "장을 올렸어요");
    } catch (e) { render(); toast(ok ? ok + "장을 올리고 멈췄어요. " + e.message : e.message); }
  }
  async function deleteAlbum() {
    var g = state.gl; if (!g || !albumPlant) return;
    try { albumPlant = (await api("deleteGrowth", { plantId: albumPlant.id, growthId: g.id })).plant; state.gl = null; renderLb(); render(); toast("사진을 삭제했어요"); } catch (e) { toast(e.message); }
  }
  async function searchPlants() {
    var q = $("#s-q").value.trim(), box = $("#s-res");
    if (!q) { toast("검색할 식물 이름을 입력해 주세요"); return; }
    $("#s-go").disabled = true; box.innerHTML = '<p class="note">검색 중이에요.</p>';
    try {
      var items = (await api("search", { q: q })).items || [];
      box.innerHTML = !items.length ? '<p class="note">검색 결과가 없어요. ‘몬스테라’처럼 짧은 이름으로 찾아 보세요.</p>' : '<div class="res-list">' + items.map(function (it) {
        return '<button type="button" class="res" data-pick="' + esc(it.id) + '">' + (it.thumb ? '<img src="' + esc(String(it.thumb).replace(/^http:/, "https:")) + '" alt="" data-ph="\u0000" referrerpolicy="no-referrer">' : "") + "<span>" + esc(it.name) + "</span></button>";
      }).join("") + "</div>";
    } catch (e) { box.innerHTML = '<p class="note">' + esc(e.message) + "</p>"; }
    var b = $("#s-go"); if (b) b.disabled = false;
  }
  async function pickPlant(id) {
    toast("관리법을 가져오는 중이에요");
    try {
      var d = (await api("detail", { id: id })).detail || {};
      if (d.water) $("#f-water").value = d.water;
      if (d.light) $("#f-light").value = d.light;
      if (d.care) $("#f-care").value = d.care;
      state.apiId = id; $("#s-res").innerHTML = "";
      toast(d.water || d.light || d.care ? "관리법을 채웠어요. 확인하고 저장하세요" : "받아온 관리 정보가 비어 있어요");
    } catch (e) { toast(e.message); }
  }

  /* ---------- 설정 ---------- */
  function buildDesign() {
    var h = '<div class="form"><span class="lbl">색상</span><div class="row" id="swatches">' + PRESETS.map(function (p) { return '<button type="button" class="sw" data-bg="' + p[1] + '" style="background:' + p[1] + '" aria-label="' + p[0] + '" title="' + p[0] + '" aria-pressed="false"></button>'; }).join("") + "</div>";
    COLORS.forEach(function (c) { h += '<div class="srow"><label for="c-' + c[0] + '">' + c[1] + '</label><input type="color" id="c-' + c[0] + '" data-ck="' + c[0] + '"><button type="button" class="btn small" data-reset="' + c[0] + '">기본</button></div>'; });
    h += "</div>";
    [["tt", "큰 제목"], ["ts", "작은 제목"], ["nm", "식물 이름 (카드)"]].forEach(function (g) {
      var k = g[0], mx = k === "tt" ? [18, 80] : k === "ts" ? [8, 28] : [10, 24];
      h += '<div class="form sec"><span class="lbl">' + g[1] + '</span>' + (k === "nm" ? "" : '<input type="text" id="t-' + k + '-text" data-tk="' + k + '" data-tf="text" maxlength="60" placeholder="비우면 숨겨져요" aria-label="' + g[1] + ' 내용">') +
        '<div class="srow"><label for="t-' + k + '-font">글씨체</label><select id="t-' + k + '-font" data-tk="' + k + '" data-tf="font">' + FONTS.map(function (f) { return '<option value="' + f[0] + '">' + f[1] + "</option>"; }).join("") + "</select></div>" +
        '<div class="srow"><label for="t-' + k + '-size">크기 <b id="t-' + k + '-sv"></b></label><input type="range" id="t-' + k + '-size" data-tk="' + k + '" data-tf="size" min="' + mx[0] + '" max="' + mx[1] + '" step="1"></div>' +
        (k === "nm" ? "" : '<div class="srow"><label for="t-' + k + '-color">글자색</label><input type="color" id="t-' + k + '-color" data-tk="' + k + '" data-tf="color"><button type="button" class="btn small" data-reset="' + k + ':color">기본</button></div>') + '</div>';
    });
    h += '<div class="row"><button type="button" class="btn small" data-reset="all">디자인 전체 초기화</button></div><p class="note">디자인 설정은 이 기기에 저장돼요. 편집을 연 상태에서 바꾸면 모든 기기에 적용돼요.</p>';
    $("#set-design").innerHTML = h;
  }
  function syncDesign() {
    COLORS.forEach(function (c) { var el = $("#c-" + c[0]); if (el && document.activeElement !== el) el.value = EFF[c[0]]; });
    ["tt", "ts", "nm"].forEach(function (k) {
      var o = T[k] || {}, d = DEF[k], tx = $("#t-" + k + "-text"), fo = $("#t-" + k + "-font"), sz = $("#t-" + k + "-size"), co = $("#t-" + k + "-color");
      if (tx && document.activeElement !== tx) tx.value = o.text == null ? d.text : o.text;
      if (fo) fo.value = o.font || d.font;
      if (sz) { sz.value = Number(o.size) || d.size; $("#t-" + k + "-sv").textContent = sz.value + "px"; }
      if (co && document.activeElement !== co) co.value = EFF[k + "color"];
    });
    var sw = document.querySelectorAll(".sw");
    for (var i = 0; i < sw.length; i++) sw[i].setAttribute("aria-pressed", sw[i].getAttribute("data-bg").toLowerCase() === EFF.bg.toLowerCase() ? "true" : "false");
  }
  function syncLock() {
    renderConn();
  }
  function openSettings() { lastFocus = document.activeElement; syncLock(); syncDesign(); $("#settings").hidden = false; updateLock(); $("#set-close").focus(); }
  function closeSettings() { $("#settings").hidden = true; updateLock(); if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} } }
  function connId(u) {
    var h = 0, i; u = String(u || "").replace(/^https:\/\/script\.google\.com\/macros\/s\//, "");
    for (i = 0; i < u.length; i++) h = (h * 31 + u.charCodeAt(i)) % 1679616;
    return h.toString(36).toUpperCase().padStart(4, "0");
  }
  function fmtTime(ms) { var d = new Date(Number(ms)); return (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
  function renderConn() {
    var mini = $("#conn-mini"), sum = $("#cn-sum"), chk = $("#cn-chk"), pend = isPending(), sy = lsGet("plantdex.synced");
    if (mini) mini.textContent = unlocked ? "편집 열림" : "보기 전용";
    if (!sum) return;
    sum.textContent = urlOk() ? "구글 시트에 연결되어 있어요." + (sy ? " 마지막으로 맞춘 때는 " + fmtTime(sy) + "이에요." : "") + (pend ? " 아직 보내지 못한 설정이 1건 있어요." : "") : "아직 웹 앱 주소가 연결되지 않았어요.";
    var rows = [
      ["•", "이 기기의 연결 번호: " + connId(webUrl()), "두 기기의 연결 번호가 같아야 같은 시트를 함께 써요. 다르면 웹 앱 주소를 똑같이 다시 적어 주세요."],
      unlocked ? ["✓", "편집이 열려 있어요", ""] : ["•", "지금은 보기 전용이에요", "비밀번호를 입력하고 ‘시트와 맞추기’를 누르면 편집할 수 있어요."],
      pend ? ["•", "아직 시트에 보내지 못한 설정이 있어요", "편집을 열고 ‘시트와 맞추기’를 눌러 주세요."] : (state.loaded ? ["✓", "시트와 맞춰져 있어요", ""] : ["•", "아직 시트와 맞추지 않았어요", "아래 ‘시트와 맞추기’를 눌러 주세요."])
    ];
    chk.innerHTML = rows.map(function (r) { return '<li><span class="mk">' + r[0] + "</span><span><b>" + esc(r[1]) + "</b>" + (r[2] ? "<small>" + esc(r[2]) + "</small>" : "") + "</span></li>"; }).join("");
  }
  function openConn() { lastFocus = document.activeElement; $("#cn-url").value = webUrl(); renderConn(); $("#conn").hidden = false; updateLock(); $("#cn-close").focus(); }
  function closeConn() { $("#conn").hidden = true; updateLock(); if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} } }
  async function syncNow() {
    var u = $("#cn-url").value.trim(), p = $("#cn-pw").value, btn = $("#cn-sync");
    if (u && u !== webUrl()) { if (!URL_RE.test(u)) { toast("웹 앱 주소가 올바르지 않아요"); return; } lsSet("plantdex.url", u); }
    btn.disabled = true;
    try {
      if (p) {
        pw = p;
        try { await api("check"); unlocked = true; lsSet("plantdex.pw", pw); $("#cn-pw").value = ""; }
        catch (e) { pw = ""; unlocked = false; toast(e.message); btn.disabled = false; renderConn(); return; }
      }
      await refresh();
      if (unlocked && isPending()) await pushTheme();
      renderConn(); if (!$("#sheet").hidden) renderSheet();
      toast(unlocked ? "시트와 맞췄어요. 편집할 수 있어요" : "시트와 맞췄어요. 보기 전용이에요");
    } catch (e) { toast(e.message); }
    btn.disabled = false;
  }
  function connCut() {
    unlocked = false; pw = ""; lsDel("plantdex.pw"); lsDel("plantdex.url"); lsDel("plantdex.synced");
    $("#cn-url").value = webUrl(); render(); if (!$("#sheet").hidden) renderSheet(); renderConn();
    toast("이 기기에 저장된 비밀번호와 주소 설정을 지웠어요");
  }

  /* ---------- 이벤트 ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-open],[data-view],[data-act],[data-gid],[data-gal],[data-bg],[data-pick],[data-reset]");
    if (!t) { if (e.target.id === "sheet") closeSheet(); else if (e.target.id === "conn") closeConn(); else if (e.target.id === "settings") closeSettings(); else if (e.target.id === "lightbox") { state.lb = null; state.gl = null; renderLb(); } return; }
    if (t.hasAttribute("data-open")) return openSheet(t.getAttribute("data-open"), "view");
    if (t.hasAttribute("data-view")) { state.view = t.getAttribute("data-view"); lsSet("plantdex.view", state.view); return render(); }
    if (t.hasAttribute("data-gid")) { state.lb = { gid: t.getAttribute("data-gid"), confirm: false }; return renderLb(); }
    if (t.hasAttribute("data-gal")) { state.gl = galItems[Number(t.getAttribute("data-gal"))] || null; return renderLb(); }
    if (t.hasAttribute("data-bg")) { T.bg = t.getAttribute("data-bg"); return themeChanged(); }
    if (t.hasAttribute("data-pick")) return pickPlant(t.getAttribute("data-pick"));
    if (t.hasAttribute("data-reset")) {
      var r = t.getAttribute("data-reset");
      if (r === "all") T = {}; else if (r.indexOf(":") > 0) { var pr = r.split(":"); if (T[pr[0]]) delete T[pr[0]][pr[1]]; } else delete T[r];
      return themeChanged();
    }
    var a = t.getAttribute("data-act");
    if (a === "settings") openSettings();
    else if (a === "set-close") closeSettings();
    else if (a === "new") { if (!urlOk() || !state.loaded) toast("도감이 아직 연결되지 않았어요"); else if (!unlocked) { toast("식물을 추가하려면 시트 연결에서 비밀번호를 입력해 주세요"); openConn(); } else openSheet(null, "new"); }
    else if (a === "close") closeSheet();
    else if (a === "edit") openSheet(state.openId, "edit");
    else if (a === "cancel") { if (state.mode === "new") closeSheet(); else { state.mode = "view"; state.pendingFile = null; renderSheet(); } }
    else if (a === "del") { state.confirm = "plant"; renderSheet(); }
    else if (a === "del-no") { state.confirm = null; renderSheet(); }
    else if (a === "del-yes") deletePlant();
    else if (a === "water") waterToday();
    else if (a === "search") searchPlants();
    else if (a === "lb-close") { state.lb = null; state.gl = null; renderLb(); }
    else if (a === "gl-del") { state.gl.confirm = true; renderLb(); }
    else if (a === "gl-del-no") { state.gl.confirm = false; renderLb(); }
    else if (a === "gl-del-yes") deleteAlbum();
    else if (a === "lb-del") { state.lb.confirm = true; renderLb(); }
    else if (a === "lb-del-no") { state.lb.confirm = false; renderLb(); }
    else if (a === "lb-del-yes") deleteGrowth();
    else if (a === "conn-open") openConn();
    else if (a === "conn-close") closeConn();
    else if (a === "conn-sync") syncNow();
    else if (a === "conn-cut") connCut();
  });
  document.addEventListener("change", function (e) {
    var t = e.target, f = t.files && t.files[0];
    if (t.id === "up-main" && f) { setMainPhoto(f); t.value = ""; }
    else if (t.id === "g-file" && f) { addGrowth(f); t.value = ""; }
    else if (t.id === "a-file" && t.files.length) { addAlbum(Array.prototype.slice.call(t.files)); t.value = ""; }
    else if (t.id === "f-photo" && f) { state.pendingFile = f; $("#f-photo-name").textContent = f.name; $("#f-prev").innerHTML = '<img src="' + URL.createObjectURL(f) + '" alt="">'; }
  });
  document.addEventListener("input", function (e) {
    var t = e.target, k;
    if (t.hasAttribute("data-ck")) { T[t.getAttribute("data-ck")] = t.value; themeChanged(); }
    else if (t.hasAttribute("data-tk")) {
      k = t.getAttribute("data-tk"); var f = t.getAttribute("data-tf");
      T[k] = T[k] || {}; T[k][f] = f === "size" ? Number(t.value) : t.value; themeChanged();
    }
  });
  document.addEventListener("submit", function (e) {
    if (e.target.id === "plant-form") { e.preventDefault(); savePlant(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.id === "s-q") { e.preventDefault(); searchPlants(); return; }
    if (e.key !== "Escape") return;
    if (!$("#lightbox").hidden) { state.lb = null; state.gl = null; renderLb(); }
    else if (!$("#conn").hidden) closeConn();
    else if (!$("#settings").hidden) closeSettings();
    else if (!$("#sheet").hidden) closeSheet();
  });

  /* ---------- 시작 ---------- */
  buildDefs(); buildDesign();
  document.addEventListener("visibilitychange", function () { if (!document.hidden && state.loaded && Date.now() - lastRefresh > 8000) refresh().catch(function () {}); });
  var local = parseTheme(lsGet("plantdex.theme")) || parseTheme(lsGet("plantdex.bg"));
  if (local) T = local;
  var v = lsGet("plantdex.view"); if (v === "group" || v === "all" || v === "gallery") state.view = v;
  applyTheme(); syncDesign(); syncLock(); render();
  (async function boot() {
    if (!urlOk()) { state.err = "아직 웹 앱 주소가 연결되지 않았어요.\nconfig.js 파일의 WEB_APP_URL에 구글 앱스 스크립트 웹 앱 URL을 붙여넣어 주세요."; render(); return; }
    try {
      await refresh();
      render();
    } catch (e) { state.err = "도감을 불러오지 못했어요.\n웹 앱 URL과 배포 설정(액세스: 모든 사용자)을 확인해 주세요.\n" + e.message; render(); return; }
    var saved = lsGet("plantdex.pw");
    if (saved) { pw = saved; try { await api("check"); unlocked = true; syncLock(); render(); if (isPending()) pushTheme(); } catch (e) { pw = ""; } }
  })();
})();
</script>
</body>
</html>
